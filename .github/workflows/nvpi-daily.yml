name: NVPI Daily 11 AM IST Content
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_daily.py'
      - '.github/workflows/nvpi-daily.yml'
permissions:
  contents: write
concurrency:
  group: nvpi-daily-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate daily package
        run: python scripts/update_daily.py
      - name: Save and publish updated content
        run: |
          cp daily/updates.json /tmp/nvpi-updates.json
          cp daily/today-explainer.mp4 /tmp/nvpi-explainer.mp4
          git fetch origin main
          git reset --hard origin/main
          mkdir -p daily
          cp /tmp/nvpi-updates.json daily/updates.json
          cp /tmp/nvpi-explainer.mp4 daily/today-explainer.mp4
          git config user.name "nvpi-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/updates.json daily/today-explainer.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Daily NVPI news, explainer and fashion update"
            git push origin HEAD:main
          fi
